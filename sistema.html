<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Impuesto a las Actividades Económicas</title>
    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/semantic.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container-fluid mt-3">
    <h2>Impuesto a las Actividades Económicas</h2>

    <div class="row">
        <!-- FORMULARIO CLIENTES -->
        <div class="col-md-6">
            <h4>Clientes</h4>
            <form id="frmCliente">
                <input pattern="^[0-9]{3,10}$" required placeholder="Código"
                       name="txtCodigoCliente" id="txtCodigoCliente" class="form-control mb-2" type="text">
                <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre"
                       name="txtNombreCliente" id="txtNombreCliente" class="form-control mb-2" type="text">
                <input placeholder="Dirección" name="txtDireccionCliente" id="txtDireccionCliente"
                       class="form-control mb-2" type="text">
                <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Teléfono"
                       name="txtTelefonoCliente" id="txtTelefonoCliente" class="form-control mb-2" type="text">
                <input placeholder="Email" name="txtEmailCliente" id="txtEmailCliente"
                       class="form-control mb-2" type="email">
                <select class="form-control mb-2" name="cboTipoPersona" id="cboTipoPersona">
                    <option value="particular">Particular</option>
                    <option value="empresa">Empresa</option>
                </select>
                <input type="submit" value="Guardar" class="btn btn-primary">
                <input type="reset" value="Limpiar" class="btn btn-warning">
            </form>

            <hr>
            <h4>Lista de Clientes</h4>
            <input placeholder="Buscar..." id="txtBuscarCliente" class="form-control mb-2">
            <table class="table table-sm table-bordered">
                <thead>
                    <tr>
                        <th>Código</th><th>Nombre</th><th>Dirección</th>
                        <th>Teléfono</th><th>Email</th><th>Tipo</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tblClientes"></tbody>
            </table>
        </div>

        <!-- FORMULARIO PERÍODOS -->
        <div class="col-md-6">
            <h4>Registrar Período de Impuesto</h4>
            <form id="frmPeriodo">
                <select class="form-control mb-2" id="cboClientePeriodo" required>
                    <option value="">-- Seleccione cliente empresa --</option>
                </select>
                <select class="form-control mb-2" id="cboProducto" required>
                    <option value="1">11801 - Comercio</option>
                    <option value="2">11802 - Industria</option>
                </select>
                <label>Desde: <input type="date" id="txtDesde" class="form-control mb-2" required></label>
                <label>Hasta: <input type="date" id="txtHasta" class="form-control mb-2" required></label>
                <input type="number" step="0.01" min="0.01" placeholder="Balance declarado"
                       id="txtBalance" class="form-control mb-2" required>
                <input type="submit" value="Calcular y Guardar" class="btn btn-success">
            </form>
            <div id="resultadoPeriodo" class="mt-3"></div>

            <hr>
            <h4>Períodos Registrados</h4>
            <table class="table table-sm table-bordered">
                <thead>
                    <tr>
                        <th>Cliente</th><th>Desde</th><th>Hasta</th>
                        <th>Balance</th><th>Precio</th><th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tblPeriodos"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- MÓDULO DE USUARIOS (PARCIAL) - HTML -->
<!-- ========================================== -->
<div class="container-fluid mt-4 mb-5">
    <div class="card shadow">
        <div class="card-header bg-dark text-white">
            <h4>Gestión de Usuarios (Examen)</h4>
        </div>
        <div class="card-body">
            <form id="frmUsuario" class="row g-2 mb-3">
                <div class="col-md-2"><input type="text" id="u_usuario" placeholder="Usuario" class="form-control" required/></div>
                <div class="col-md-2"><input type="text" id="u_clave" placeholder="Clave" class="form-control" required/></div>
                <div class="col-md-3"><input type="text" id="u_nombre" placeholder="Nombre Completo" class="form-control" required/></div>
                <div class="col-md-2"><input type="text" id="u_direccion" placeholder="Dirección" class="form-control" required/></div>
                <div class="col-md-2"><input type="text" id="u_telefono" placeholder="Teléfono" class="form-control" required/></div>
                <div class="col-md-1"><button type="submit" class="btn btn-success w-100">Guardar</button></div>
            </form>
            <table class="table table-sm table-bordered">
                <thead class="table-dark">
                    <tr><th>ID</th><th>Usuario</th><th>Nombre</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tblUsuarios"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- SCRIPTS -->
<!-- ========================================== -->
<script>
    // ================== CLIENTES ==================
    let accion = 'nuevo', idCliente = '';

    document.getElementById('frmCliente').addEventListener('submit', e => {
        e.preventDefault();
        guardarCliente();
    });

    document.getElementById('frmCliente').addEventListener('reset', e => {
        e.preventDefault();
        limpiarFormularioCliente();
    });

    document.getElementById('txtBuscarCliente').addEventListener('keyup', () => {
        obtenerClientes();
    });

    async function obtenerClientes() {
        const buscar = document.getElementById('txtBuscarCliente').value;
        const response = await fetch('/clientes?buscar=' + encodeURIComponent(buscar));
        const datos = await response.json();
        mostrarClientes(datos);
    }

    function mostrarClientes(datos) {
        let filas = '';
        const cbo = document.getElementById('cboClientePeriodo');
        let opciones = '<option value="">-- Seleccione cliente empresa --</option>';

        datos.forEach(c => {
            filas += `<tr>
                <td>${c.codigo}</td>
                <td>${c.nombre}</td>
                <td>${c.direccion}</td>
                <td>${c.telefono}</td>
                <td>${c.email}</td>
                <td>${c.tipo}</td>
                <td>
                    <button onclick='modificarCliente(${JSON.stringify(c)})'
                            class="btn btn-sm btn-info">Editar</button>
                    <button onclick='eliminarCliente(${JSON.stringify(c)})'
                            class="btn btn-sm btn-danger">Eliminar</button>
                </td>
            </tr>`;
            if (c.tipo === 'empresa') {
                opciones += `<option value="${c.idCliente}">${c.nombre}</option>`;
            }
        });
        document.getElementById('tblClientes').innerHTML = filas;
        cbo.innerHTML = opciones;
    }

    function modificarCliente(data) {
        accion = 'modificar';
        idCliente = data.idCliente;
        txtCodigoCliente.value = data.codigo;
        txtNombreCliente.value = data.nombre;
        txtDireccionCliente.value = data.direccion;
        txtTelefonoCliente.value = data.telefono;
        txtEmailCliente.value = data.email;
        cboTipoPersona.value = data.tipo;
    }

    function eliminarCliente(data) {
        if (confirm(`¿Seguro eliminar el cliente: ${data.nombre}?`)) {
            idCliente = data.idCliente;
            accion = 'eliminar';
            guardarCliente();
        }
    }

    async function guardarCliente() {
        const datos = {
            codigo: txtCodigoCliente.value,
            nombre: txtNombreCliente.value,
            direccion: txtDireccionCliente.value,
            telefono: txtTelefonoCliente.value,
            email: txtEmailCliente.value,
            tipo: cboTipoPersona.value,
            accion, idCliente
        };
        const response = await fetch('/cliente', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });
        const respuesta = await response.json();
        if (respuesta.msg !== 'ok') {
            alert('Error: ' + respuesta.msg);
            return;
        }
        obtenerClientes();
        limpiarFormularioCliente();
    }

    function limpiarFormularioCliente() {
        accion = 'nuevo'; idCliente = '';
        txtCodigoCliente.value = '';
        txtNombreCliente.value = '';
        txtDireccionCliente.value = '';
        txtTelefonoCliente.value = '';
        txtEmailCliente.value = '';
        cboTipoPersona.value = 'particular';
    }

    // ================== PERÍODOS ==================
    document.getElementById('frmPeriodo').addEventListener('submit', async e => {
        e.preventDefault();
        const datos = {
            cliente_id: document.getElementById('cboClientePeriodo').value,
            producto_id: document.getElementById('cboProducto').value,
            desde: document.getElementById('txtDesde').value,
            hasta: document.getElementById('txtHasta').value,
            balance: document.getElementById('txtBalance').value
        };
        const response = await fetch('/periodo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });
        const respuesta = await response.json();

        console.log("RESPUESTA DEL SERVIDOR:", respuesta);
        const resultado = document.getElementById('resultadoPeriodo');

        if (respuesta.estado === 'ok') {
            const d = respuesta.detalle;
            resultado.innerHTML = `
                <div class="alert alert-success">
                    <h5>Período guardado correctamente</h5>
                    <p><strong>Balance:</strong> $${d.balance.toFixed(2)}</p>
                    <p><strong>Tipo de cálculo:</strong> ${d.tipo}</p>
                    ${ d.tipo === 'bloques' ? `
                            <p><strong>Desde tarifa:</strong> $${d.desde.toFixed(2)}</p>
                            <p><strong>Precio base:</strong> $${d.precio_base.toFixed(2)}</p>
                            <p><strong>Excedente:</strong> $${d.excedente.toFixed(2)}</p>
                            <p><strong>Bloques:</strong> ${d.bloques}</p>
                            <p><strong>Adicional:</strong> $${d.adicional.toFixed(2)}</p>
                          ` : `
                            <p><strong>Porcentaje:</strong> ${d.porcentaje}%</p>
                          ` }
                    <hr>
                    <h4>Impuesto calculado: $${respuesta.precio.toFixed(2)}</h4>
                </div>
            `;
        } else {
            resultado.innerHTML = `
                <div class="alert alert-danger">
                    <strong>Error:</strong> ${respuesta.mensaje || 'El servidor no devolvió un mensaje de error.'}
                </div>
            `;
        }
        obtenerPeriodos();
    });

    async function obtenerPeriodos() {
        const response = await fetch('/periodos');
        const datos = await response.json();
        let filas = '';
        datos.forEach(p => {
            filas += `<tr>
                <td>${p.cliente}</td>
                <td>${p.desde}</td>
                <td>${p.hasta}</td>
                <td>$${p.balance}</td>
                <td>$${p.precio_calculado}</td>
                <td>${p.facturado ? 'Facturado' : 'Vigente'}</td>
            </tr>`;
        });
        document.getElementById('tblPeriodos').innerHTML = filas;
    }

    // Cargar datos al inicio
    obtenerClientes();
    obtenerPeriodos();
</script>

<script>
    // ================== USUARIOS (PARCIAL) ==================
    let accionUsuario = 'nuevo';
    let idUsuario = '';

    document.getElementById('frmUsuario').addEventListener('submit', async (e) => {
        e.preventDefault();
        const datos = {
            accion: accionUsuario,
            idUsuario: idUsuario,
            usuario: document.getElementById('u_usuario').value,
            clave: document.getElementById('u_clave').value,
            nombre: document.getElementById('u_nombre').value,
            direccion: document.getElementById('u_direccion').value,
            telefono: document.getElementById('u_telefono').value
        };
        const res = await fetch('/usuario', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(datos)
        });
        const resp = await res.json();
        if(resp.msg === 'ok') {
            alert('Usuario guardado con éxito');
            document.getElementById('frmUsuario').reset();
            accionUsuario = 'nuevo';
            idUsuario = '';
            obtenerUsuarios();
        } else {
            alert('Error: ' + resp.msg);
        }
    });

    async function obtenerUsuarios() {
        const res = await fetch('/usuarios');
        const datos = await res.json();
        let filas = '';
        datos.forEach(u => {
            filas += `<tr>
                <td>${u.idUsuario}</td>
                <td>${u.usuario}</td>
                <td>${u.nombre}</td>
                <td>${u.direccion}</td>
                <td>${u.telefono}</td>
                <td>
                    <button onclick='editarUsuario(${JSON.stringify(u)})' class="btn btn-sm btn-warning">Editar</button>
                    <button onclick='eliminarUsuario(${u.idUsuario})' class="btn btn-sm btn-danger">Eliminar</button>
                </td>
            </tr>`;
        });
        document.getElementById('tblUsuarios').innerHTML = filas;
    }

    function editarUsuario(u) {
        accionUsuario = 'modificar';
        idUsuario = u.idUsuario;
        document.getElementById('u_usuario').value = u.usuario;
        document.getElementById('u_clave').value = u.clave;
        document.getElementById('u_nombre').value = u.nombre;
        document.getElementById('u_direccion').value = u.direccion;
        document.getElementById('u_telefono').value = u.telefono;
    }

    async function eliminarUsuario(id) {
        if(confirm('¿Eliminar usuario?')) {
            await fetch('/usuario', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({accion: 'eliminar', idUsuario: id})
            });
            obtenerUsuarios();
        }
    }

    // Llamar al inicio
    obtenerUsuarios();
</script>
</body>
</html>
