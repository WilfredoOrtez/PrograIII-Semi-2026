<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Sistema</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>Iniciar Sesión</h4>
                    </div>
                    <div class="card-body">
                        <form id="frmLogin">
                            <div class="mb-3">
                                <label>Usuario:</label>
                                <input type="text" id="txtUsuario" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label>Clave:</label>
                                <input type="password" id="txtClave" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                        <div id="mensaje" class="mt-3 text-center text-danger fw-bold"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('frmLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const datos = {
                usuario: document.getElementById('txtUsuario').value,
                clave: document.getElementById('txtClave').value
            };
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(datos)
            });
            const resp = await res.json();
            
            if (resp.ok) {
                window.location.href = '/sistema.html'; 
            } else {
                document.getElementById('mensaje').innerText = resp.msg;
            }
        });
    </script>
</body>
</html>
