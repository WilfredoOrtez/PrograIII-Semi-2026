<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sostema de impuesto a las actividades economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid"> 
        <div class="row">
            <div class="col-6">
                <form id="frmCliente">
                    <div class="container text-center">
                        <div class="row">
                            <div class="col">
                                <input pattern="^[0-9]{3,10}$" required placeholder="Codigo" name="txtCodigoCliente" id="txtCodigoCliente"
                                    class="form-control" type="text">
                            </div>
                    </div>
                    <div class="row">
                            <div class="col">
                                <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required placeholder="Nombre" name="txtNombreCliente" id="txtNombreCliente"
                                    class="form-control" type="text">
                            </div>
                    </div>
                    <div class="row">
                            <div class="col">
                                <input placeholder="Direccion" name="txtDireccionCliente" id="txtDireccionCliente"
                                    class="form-control" type="text">
                            </div>
                    </div>
                    <div class="row">
                            <div class="col">
                                <input pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Telefono" name="txtTelefonoCliente" id="txtTelefonoCliente"
                                    class="form-control" type="text">
                            </div>
                    </div>
                    <div class="row">
                            <div class="col">
                                <input placeholder="Email" name="txtEmailCliente" id="txtEmailCliente" class="form-control"
                                    type="email">
                            </div>
                    </div>
                    <div class="row">
                            <div class="col">
                                <select class="form-control" name="cboTipoPersona" id="cboTipoPersona">
                                    <option value="particular">Particular</option>
                                    <option value="empresa">Empresa</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                            <div class="col">
                                <input type="submit" value="Guardar" class="btn btn-primary">
                                <input type="button" value="Buscar" class="btn btn-secondary">
                                <input type="reset" value="Limpiar" class="btn btn-warning">
                            </div>
                </div>
            </Form>
            </div>
        <script>

    var accion='nuevo',
        idCliente = '';
    
    frmCliente.addEventListener('submit',(e)=>{
        e.preventDefault();
        guardarClientes();
        
    });
    frmCliente.addEventListener('reset',(e)=>{
        e.preventDefault();
        limpiarFormulario();
    });
    txtBuscarCliente.addEventListener('keyup',(e)=>{
        e.preventDefault();
        obtenerClientes();
    });

    async function obtenerClientes(){
        let response = await fetch('/clientes'),
        datos = await response.json();
        mostrarDatos(datos);
    }
    
    function mostrarDatos(Datos){
        let filas = '';
        datos.forEach(e => {
            filas += `<tr>
                <td>${cliente.codigo}</td>
                <td>${cliente.nombre}</td>
                <td>${cliente.direccion}</td>
                <td>${cliente.telefono}</td>
                <td>${cliente.email}</td>
                <td>${cliente.tipo}</td>
                <td>
                    <button onClick = "eliminarCliente('${JSON.stringify(e)}', event)"
                        type="botton" value="DEL" class="btn btn-danger"</button>
                    </td>
            </tr>`;
        });
        tblClientes.innerHTML = filas;
    }

    function modificarCliente(data, event){
        event.preventDefault();
        accion = 'modificar';
        idCliente = data.idCliente;
        txtCodigoCliente.value = data.codigo;
        txtNombreCliente.value = data.nombre;
        txtDireccionCliente.value = data.direccion;
        txtTelefonoCliente.value = data.telefono;
        txtEmailCliente.value = data.email;
        cboTipoPersona.value = data.tipo;
    }

    function EliminarCliente(data, event){
        event.preventDefault();
        if(confirm('¿Seguro eliminar el cliente: ${data.nombre}?')){
            idCliente = data.idCliente;
            accion = 'eliminar';
            guardarClientes();
        }
    }

    async function guardarClientes(){
        let datos = {
            codigo: txtCodigoCliente.value,
            nombre: txtNombreCliente.value,
            direccion: txtDireccionCliente.value,
            telefono: txtTelefonoCliente.value,
            email: txtEmailCliente.value,
            tipo: cboTipoPersona.value,
            accion,
            idCliente
        }
        let response = await fetch('/cliente',{
            method:'POST',
            headers:{
                'Content-Type':'application/json'
            },
            body:JSON.stringify(datos)
        }), respuesta = response.json();
        if(respuesta.msg!="ok"){
            alert("Error: "+ respuesta.msg);
            return;
        }
        obtenerClientes();
        limpiarFormulario();
    }
    function limpiarFormulario(){
        accion = 'nuevo';
        idCliente = '';
        txtCodigoCliente.value = '';
        txtNombreCliente.value = '';
        txtDireccionCliente.value = '';
        txtTelefonoCliente.value = '';
        txtEmailCliente.value = '';
        cboTipoPersona.value = 'particular';
    }
</script>
</body>
</html>
