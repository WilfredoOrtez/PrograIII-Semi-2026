<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sostema de impuesto a las actividades economicas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container-fluid"> 
        <div class="row">
            <div class="col-6">
                <div class="container-text-center">
                    <div class="row">
                        <div class="col">
                            <input placeholder="Codigo" name="txtCodigoCliente" id="txtCodigoCliente" class="form-control" type="text">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input placeholder="Nombre" name="txtNombreCliente" id="txtNombreCliente" class="form-control" type="text">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input placeholder="Dirrecion" name="txtDireccionCliente" id="txtDireccionCliente" class="form-control" type="text">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input placeholder="Telefono" name="txtTelefonoCliente" id="txtTelefonoCliente" class="form-control" type="text">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input placeholder="email" name="txtEmailCliente" id="txtEmailCliente" class="form-control" type="text">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <select class="from-control" name="cboTipoPersona" id="cboTipoPersona">
                                <option value="particular">Particular</option>
                                <option value="empresa">Empresa</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <input type="button" value="Guardar" class="btn btn-primary">
                            <input type="button" value="Buscar" class="btn btn-secondary">
                            <input type="reset" value="limpiar" class="btn btn-warning">
                        </div>
                </div>
            </div>
</body>
</html>
